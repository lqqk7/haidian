<meta charset="utf-8">
<title>op04-detail.en — eight-element cards + disclaimer strip</title>
<style>
  @font-face{font-family:'SHS';src:local('Source Han Sans SC Regular'),url('file:///Users/tutu/Library/Fonts/SourceHanSansSC-Regular.otf');font-weight:400}
  @font-face{font-family:'SHS';src:local('Source Han Sans SC Medium'),url('file:///Users/tutu/Library/Fonts/SourceHanSansSC-Medium.otf');font-weight:500}
  @font-face{font-family:'SHS';src:local('Source Han Sans SC Bold'),url('file:///Users/tutu/Library/Fonts/SourceHanSansSC-Bold.otf');font-weight:700}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1176px;height:299px;background:#F2EFE7;
    font-family:'SHS','Source Han Sans SC',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{position:absolute;left:31.5px;top:4px;width:1113px}
  .grid{display:flex;gap:11.5px;margin-bottom:8px;align-items:stretch}
  .card{flex:1 1 0;min-width:0;background:#fff;border:1px solid #E3DFD4;border-radius:7px;
        padding:11px 13px 11px;display:flex;flex-direction:column}
  .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .ttl{font-weight:700;font-size:14px;line-height:1.25;color:#10383D;flex:1 1 auto;min-width:0}
  .bdg{flex:0 0 auto;white-space:nowrap;background:#D9A33A;color:#fff;font-weight:700;
       font-size:10.5px;line-height:1;border-radius:999px;padding:5px 9px 6px}
  .bd{font-size:12.5px;line-height:1.42;color:#22323A;margin-bottom:5px}
  .cl{font-size:11.5px;line-height:1.3;color:#8A8578;margin-top:auto}
  .strip{background:#10383D;color:#fff;border-radius:7px;padding:9px 16px;
         font-size:12.5px;line-height:1.42;font-weight:500}
</style>
<div class="wrap">
  <div class="grid" id="r1"></div>
  <div class="grid" id="r2"></div>
  <div class="strip" id="strip"></div>
</div>
<script>
/* 文本逐条取自包内既有英文表述：
   卡片标题/正文 —— assets/figures/op04-detail.en.png 现版八要素卡（母版：proposal.en.md L846
   "clear width, gradient, crossing, surface, drainage, tactile system, acoustic environment,
   maintenance boundary"）；分类词 code framework / design judgement / operational design ——
   visual/assets/sensory-design-code.json statement_en；徽标 "pending site audit" ——
   proposal.en.md L846 "every card carrying a pending-site-audit status"。 */
const CARDS=[
 ['Clear width','two-way ≥1.80 m, target 2.50 m','code framework'],
 ['Gradient','≤2% runs; ramps ≤1:12 with landings','code framework'],
 ['Crossing stitch','kerb ramp ≥1.20 m + tactile warning','code framework'],
 ['Surface','permeable, slip-resistant, continuous','design judgement'],
 ['Drainage','1–2% cross-fall + linear drain, dry tactile path','design judgement'],
 ['Tactile system','0.30 m guide path, warning type at junctions','code framework'],
 ['Acoustic env.','1.50 m quiet green buffer, low-noise fixtures','design judgement'],
 ['Maintenance','band-wise inspection, monthly tactile check, faults enter the SEB handover path','operational design']
];
/* 免责条带英文，逐段取自包内：
   "Concept Stage" —— 本图英文标题 "OP-04 Continuity Break · Node Detailing (Concept Stage)";
   "design target values" / "pending site audit" —— 本图英文段标题与 proposal.en.md L846;
   "construction drawing" —— proposal.en.md L708/L717;
   "Before site audit and confirmation by an authorising body, none of it constitutes an
    engineering conclusion" —— visual/assets/sensory-design-code.json（逐字）;
   "Barrier-Free Environment Construction Law" —— proposal.en.md L77 法定英文名。 */
const STRIP='Concept stage · all dimensions are design target values · not construction drawings · '+
 'before site audit and confirmation by an authorising body, none of it constitutes an engineering conclusion · '+
 'basis: Barrier-Free Environment Construction Law / GB 55019-2021';
const mk=k=>'<div class="card"><div class="hd"><div class="ttl">'+k[0]+
  '</div><div class="bdg">pending site audit</div></div>'+
  '<div class="bd">'+k[1]+'</div><div class="cl">'+k[2]+'</div></div>';
r1.innerHTML=CARDS.slice(0,4).map(mk).join('');
r2.innerHTML=CARDS.slice(4).map(mk).join('');
strip.textContent=STRIP;
</script>
